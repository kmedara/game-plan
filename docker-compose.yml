services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: gameplan-dynamodb
    restart: unless-stopped
    user: root
    working_dir: /home/dynamodblocal
    ports:
      - '8000:8000'
    environment:
      # Jetty in DynamoDB Local 3.x binds IPv6-only by default; other Compose
      # services reach this container over the IPv4 bridge and would time out.
      JAVA_TOOL_OPTIONS: '-Djava.net.preferIPv4Stack=true'
    # -disableTelemetry avoids a startup hang when outbound telemetry is blocked.
    command:
      [
        '-jar',
        'DynamoDBLocal.jar',
        '-sharedDb',
        '-dbPath',
        './data',
        '-disableTelemetry',
      ]
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -o /dev/null -X POST http://127.0.0.1:8000/ -H "Content-Type: application/x-amz-json-1.0" -H "X-Amz-Target: DynamoDB_20120810.ListTables" -H "Authorization: AWS4-HMAC-SHA256 Credential=local/20200101/us-east-1/dynamodb/aws4_request, SignedHeaders=host;x-amz-date, Signature=aaaa" -d "{}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: local/Dockerfile.api
    container_name: gameplan-api
    restart: unless-stopped
    depends_on:
      dynamodb:
        condition: service_healthy
    ports:
      - '3000:3000'
      - '9229-9236:9229-9236'
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      LISTEN_HOST: '0.0.0.0'
      NODE_INSPECT_HOST: '0.0.0.0'
      CLIENT_ORIGIN: http://localhost:4200
      MEDIA_PUBLIC_ORIGIN: http://localhost:3000
      MEDIA_BUCKET: gameplan-media-local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AUTH_DISABLED: 'true'
      AUTH_SEED_USER_ID: '44444444-4444-4444-8444-444444444444'
      AUTH_CALLBACK_URL: http://localhost:3000/identity/oauth/callback
    develop:
      watch:
        - action: sync
          path: ./functions
          target: /app/functions
        - action: sync
          path: ./local
          target: /app/local
        - action: sync
          path: ./lib
          target: /app/lib
        - action: sync
          path: ./config
          target: /app/config
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/identity/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  client:
    build:
      context: .
      dockerfile: local/Dockerfile.client
    container_name: gameplan-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '4200:4200'
      - '49153:49153'
    environment:
      API_BASE_URL: http://localhost:3000
      WS_BASE_URL: ws://localhost:3000/socket
      AUTH_DISABLED: 'true'
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
        - action: sync
          path: ./lib/types
          target: /app/lib/types

volumes:
  dynamodb-data:
