<div class="theme-toggle" role="group" aria-label="Color theme">
  @for (option of options; track option.mode) {
    <button
      type="button"
      [attr.aria-pressed]="theme.mode() === option.mode"
      (click)="theme.setMode(option.mode)"
    >
      {{ option.label }}
    </button>
  }
</div>
