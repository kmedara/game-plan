<section class="stack" style="padding-top: 2rem">
  <h1>{{ 'completeProfile.title' | transloco }}</h1>
  <p class="muted">{{ 'completeProfile.hint' | transloco }}</p>

  <form class="stack" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'completeProfile.displayName' | transloco }}</mat-label>
      <input matInput formControlName="displayName" autocomplete="name" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'completeProfile.birthday' | transloco }}</mat-label>
      <input matInput type="date" formControlName="birthday" autocomplete="bday" />
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || busy()">
      {{ 'common.save' | transloco }}
    </button>
  </form>
</section>
