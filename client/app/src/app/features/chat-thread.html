<section class="stack">
  <div class="row">
    <a mat-button routerLink="/chats">{{ 'nav.back' | transloco }}</a>
    <h1 style="font-size: 1.15rem; margin: 0">{{ chatName() }}</h1>
  </div>

  <div class="stack chat-thread" style="flex-direction: column-reverse">
    @for (message of messages(); track message.messageId) {
      <button
        type="button"
        class="chat-message"
        [attr.aria-expanded]="revealedMessageId() === message.messageId"
        (click)="toggleMeta(message.messageId)"
      >
        <span class="chat-avatar" aria-hidden="true">
          @if (photoUrl(message); as url) {
            <img [src]="url" alt="" />
          } @else {
            {{ initials(message) }}
          }
        </span>
        <span class="chat-message-copy">
          @if (revealedMessageId() === message.messageId) {
            <span class="chat-message-meta">
              <span class="chat-sender">{{ senderName(message) }}</span>
              <span class="muted">{{ message.createdAt | date: 'short' }}</span>
            </span>
          }
          @if (message.body.length > 0) {
            <span class="chat-body">{{ message.body }}</span>
          }
          @if (message.attachmentKeys?.length) {
            <span class="chat-attachments">
              @for (key of message.attachmentKeys; track key) {
                @if (attachmentUrl(key); as url) {
                  <img class="chat-attachment" [src]="url" alt="" />
                }
              }
            </span>
          }
        </span>
      </button>
    }
  </div>

  @if (pendingAttachments().length > 0) {
    <div class="chat-pending-attachments">
      @for (item of pendingAttachments(); track item.key) {
        <div class="chat-pending-item">
          <img [src]="item.previewUrl" alt="" />
          <button
            mat-button
            type="button"
            [attr.aria-label]="'chats.removePhoto' | transloco"
            (click)="removePending(item.key)"
          >
            {{ 'chats.removePhoto' | transloco }}
          </button>
        </div>
      }
    </div>
  }

  @if (attachError(); as err) {
    <p class="error">{{ err | transloco }}</p>
  }

  <form class="row chat-composer" (ngSubmit)="send()">
    <input
      #photoInput
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
      hidden
      (change)="onPhotoSelected($event)"
    />
    <button
      mat-button
      type="button"
      [disabled]="uploading() || pendingAttachments().length >= maxAttachments"
      (click)="photoInput.click()"
    >
      {{ uploading() ? ('chats.uploading' | transloco) : ('chats.attachPhoto' | transloco) }}
    </button>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ 'chats.message' | transloco }}</mat-label>
      <textarea
        matInput
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="6"
        [(ngModel)]="draft"
        name="draft"
        (keydown.enter)="submitDraft($event)"
      ></textarea>
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit" [disabled]="uploading()">
      {{ 'chats.send' | transloco }}
    </button>
  </form>
</section>
