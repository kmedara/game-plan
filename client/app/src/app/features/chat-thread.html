<section class="stack">
  <div class="row">
    <a mat-button routerLink="/chats">Back</a>
    <h1 style="font-size: 1.15rem; margin: 0">Chat</h1>
  </div>

  <div class="stack" style="flex-direction: column-reverse">
    @for (message of messages(); track message.messageId) {
      <article style="padding: 0.65rem; background: #f8fafc; border-radius: 0.5rem">
        <div class="muted">{{ message.createdAt | date: 'short' }}</div>
        <div>{{ message.body }}</div>
      </article>
    }
  </div>

  <form class="row" (ngSubmit)="send()">
    <mat-form-field appearance="outline" style="flex: 1">
      <mat-label>Message</mat-label>
      <input matInput [(ngModel)]="draft" name="draft" />
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit">Send</button>
  </form>
</section>
