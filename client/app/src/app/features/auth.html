<section class="stack auth-page">
  <h1>{{ 'auth.signIn' | transloco }}</h1>
  <p class="muted">{{ 'auth.tagline' | transloco }}</p>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (authDisabled) {
    <p class="muted">
      {{
        'auth.localBypass'
          | transloco: { email: seedUserEmail() || ('auth.seedUser' | transloco) }
      }}
    </p>
    <button mat-flat-button color="primary" type="button" [disabled]="busy()" (click)="continueLocal()">
      {{ 'auth.continue' | transloco }}
    </button>
  } @else {
    <button mat-flat-button color="primary" type="button" (click)="startHostedUi()">
      {{ 'auth.continueCognito' | transloco }}
    </button>
    <p class="muted">{{ 'auth.cognitoHint' | transloco }}</p>
  }
</section>
