name: Deploy client

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-client-${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm ci

      - name: Load Parameter Store
        run: npx tsx infrastructure/scripts/load-ssm-env.ts client
        env:
          SSM_PREFIX: ${{ vars.SSM_PREFIX || '/gameplan' }}

      - name: Build website
        run: npm run client:build
        env:
          BUILD_CONFIGURATION: production
          EXPO_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
          EXPO_PUBLIC_WS_BASE_URL: ${{ env.WS_BASE_URL }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ env.GOOGLE_MAPS_BROWSER_API_KEY }}
          EXPO_PUBLIC_AUTH_DISABLED: 'false'

      - name: Publish website
        run: |
          aws s3 sync client/expo/dist "s3://${SITE_BUCKET_NAME}" --delete
          aws cloudfront create-invalidation --distribution-id "${SITE_DISTRIBUTION_ID}" --paths "/*"
