name: Google Maps keys

# Applies infrastructure/terraform-google: the Maps keys and their Parameter
# Store values. Run by hand; the next deploy hands the keys to the website and EAS.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: choice
        options:
          - staging
          - production
        default: staging
      apply:
        description: Apply the plan (off only plans)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: google-maps-keys-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_IN_AUTOMATION: 'true'
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_ssm_prefix: ${{ vars.SSM_PREFIX || '/gameplan' }}
    defaults:
      run:
        working-directory: infrastructure/terraform-google
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Both values come from scripts/github-oidc.sh.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Init
        run: |
          set -o pipefail
          bucket=$(aws cloudformation describe-stacks --stack-name GamePlanPlatform \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformStateBucketName'].OutputValue" --output text)
          if [ -z "${bucket}" ] || [ "${bucket}" = "None" ]; then
            echo "Missing TerraformStateBucketName, a GamePlanPlatform output. Deploy this environment first."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="envs/${DEPLOY_ENV}.s3.tfbackend" \
            -backend-config="bucket=${bucket}" \
            -backend-config="region=${AWS_REGION}" 2>&1 | awk -f "$GITHUB_WORKSPACE/.github/scripts/redact-aws-log.awk"

      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -out=maps.tfplan -var-file="envs/${DEPLOY_ENV}.tfvars" 2>&1 \
            | awk -f "$GITHUB_WORKSPACE/.github/scripts/redact-aws-log.awk"

      - name: Apply
        if: inputs.apply
        run: |
          set -o pipefail
          terraform apply -input=false maps.tfplan 2>&1 | awk -f "$GITHUB_WORKSPACE/.github/scripts/redact-aws-log.awk"
          echo "Run Deploy for ${DEPLOY_ENV} so the website and EAS get the new keys." >> "$GITHUB_STEP_SUMMARY"
