name: Stripe webhook IPs

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Sync Stripe webhook IP list
        run: node infrastructure/scripts/sync-stripe-webhook-ips.mjs

      - name: Open pull request when the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        # Every line stays indented: an unindented heredoc line would end this YAML block.
        run: |
          if git diff --quiet -- infrastructure/data/stripe-webhook-ips.json; then
            echo "stripe-webhook-ips.json is up to date"
            exit 0
          fi
          branch="chore/stripe-webhook-ips-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add infrastructure/data/stripe-webhook-ips.json
          git commit -m "chore(infra): refresh stripe webhook ips" \
            -m "Automated sync from Stripe's published webhook IP feed."
          git push -u origin "$branch"
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "## Summary"
            echo "- Updates \`infrastructure/data/stripe-webhook-ips.json\` from Stripe's webhook IP feed."
            echo
            echo "## Test plan"
            echo "- [ ] CI passes"
            echo "- [ ] Deploy staging after merge"
            echo "- [ ] Stripe Dashboard → send test webhook on payments and billing endpoints"
          } > "$body"
          gh pr create --title "chore(infra): refresh stripe webhook ips" --body-file "$body"
