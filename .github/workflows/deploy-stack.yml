name: Deploy stack

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment
        required: true
        type: string
      stack:
        description: dns, platform, or api
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.stack }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm ci

      - name: Load Parameter Store
        run: |
          set -o pipefail
          npx tsx infrastructure/scripts/load-ssm-env.ts api 2>&1 | awk -f .github/scripts/redact-aws-log.awk
        env:
          SSM_PREFIX: ${{ vars.SSM_PREFIX || '/gameplan' }}

      - name: Deploy ${{ inputs.stack }}
        env:
          STACK: ${{ inputs.stack }}
          DEPLOY_ENV: ${{ inputs.environment }}
          HOSTED_ZONE_ROLE_ARN: ${{ secrets.HOSTED_ZONE_ROLE_ARN }}
        run: |
          set -o pipefail
          case "$STACK" in
            dns) stack_name=GamePlanDns ;;
            platform) stack_name=GamePlanPlatform ;;
            api) stack_name=GamePlanApi ;;
            *) echo "Unknown stack: $STACK"; exit 1 ;;
          esac
          missing=""
          for name in DEPLOY_ENV HOSTED_ZONE_ID HOSTED_ZONE_NAME HOSTED_ZONE_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "Missing deploy settings:${missing}. HOSTED_ZONE_ID and HOSTED_ZONE_NAME come from Parameter Store. HOSTED_ZONE_ROLE_ARN is a repository secret."
            exit 1
          fi
          npm run deploy -w @gameplan/infrastructure -- "$stack_name" --exclusively --outputs-file "$GITHUB_WORKSPACE/cdk-outputs.json" 2>&1 | awk -f .github/scripts/redact-aws-log.awk

      - name: Publish stack outputs
        run: |
          set -o pipefail
          npx tsx infrastructure/scripts/publish-stack-outputs.ts "$GITHUB_WORKSPACE/cdk-outputs.json" "${{ inputs.stack }}" 2>&1 | awk -f .github/scripts/redact-aws-log.awk
        env:
          SSM_PREFIX: ${{ vars.SSM_PREFIX || '/gameplan' }}
