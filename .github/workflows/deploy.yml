name: Deploy

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm ci

      - name: Load Parameter Store
        run: |
          set -o pipefail
          npx tsx infrastructure/scripts/load-ssm-env.ts 2>&1 | awk -f .github/scripts/redact-aws-log.awk
        env:
          SSM_PREFIX: ${{ vars.SSM_PREFIX || '/gameplan' }}

      - name: Deploy stacks
        run: |
          set -o pipefail
          missing=""
          for name in DEPLOY_ENV HOSTED_ZONE_ID HOSTED_ZONE_NAME; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "Missing deploy settings:${missing}. HOSTED_ZONE_ID and HOSTED_ZONE_NAME come from Parameter Store."
            exit 1
          fi
          npm run deploy -w @gameplan/infrastructure -- --all --outputs-file "$GITHUB_WORKSPACE/cdk-outputs.json" 2>&1 | awk -f .github/scripts/redact-aws-log.awk

      - name: Load stack outputs
        run: npx tsx infrastructure/scripts/load-outputs-env.ts "$GITHUB_WORKSPACE/cdk-outputs.json"

      - name: Build website
        run: npm run client:build
        env:
          BUILD_CONFIGURATION: production
          EXPO_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
          EXPO_PUBLIC_WS_BASE_URL: ${{ env.WS_BASE_URL }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ env.GOOGLE_MAPS_BROWSER_API_KEY }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          EXPO_PUBLIC_AUTH_DISABLED: 'false'
          # App-link files for the store apps. Leave unset until the apps ship for this environment.
          # The same team id Sign in with Apple uses, when Parameter Store already has it.
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || env.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

      - name: Publish website
        run: |
          set -o pipefail
          {
            aws s3 sync client/expo/dist "s3://${SITE_BUCKET_NAME}" --delete
            # iOS reads this file as JSON, and it has no extension to infer that from.
            if [ -f client/expo/dist/.well-known/apple-app-site-association ]; then
              aws s3 cp client/expo/dist/.well-known/apple-app-site-association \
                "s3://${SITE_BUCKET_NAME}/.well-known/apple-app-site-association" \
                --content-type application/json
            fi
            aws cloudfront create-invalidation --distribution-id "${SITE_DISTRIBUTION_ID}" --paths "/*"
          } 2>&1 | awk -f .github/scripts/redact-aws-log.awk
