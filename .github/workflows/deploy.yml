name: Deploy

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: npm ci

      - name: Load Parameter Store
        run: |
          set -o pipefail
          npx tsx infrastructure/scripts/load-ssm-env.ts 2>&1 | awk -f .github/scripts/redact-aws-log.awk
        env:
          SSM_PREFIX: ${{ vars.SSM_PREFIX || '/gameplan' }}

      - name: Deploy stacks
        run: |
          set -o pipefail
          missing=""
          for name in DEPLOY_ENV HOSTED_ZONE_ID HOSTED_ZONE_NAME; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "Missing deploy settings:${missing}. HOSTED_ZONE_ID and HOSTED_ZONE_NAME come from Parameter Store."
            exit 1
          fi
          npm run deploy -w @gameplan/infrastructure -- --all --outputs-file "$GITHUB_WORKSPACE/cdk-outputs.json" 2>&1 | awk -f .github/scripts/redact-aws-log.awk

      - name: Load stack outputs
        run: npx tsx infrastructure/scripts/load-outputs-env.ts "$GITHUB_WORKSPACE/cdk-outputs.json"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      # Stripe plans and webhooks, and the EAS build variables. Runs after CDK
      # because the webhook URLs and the state bucket are stack outputs.
      - name: Apply Stripe and Expo
        working-directory: infrastructure/terraform
        run: |
          set -o pipefail
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "Missing TF_STATE_BUCKET, a GamePlanPlatform output."
            exit 1
          fi
          # Terraform reads the Stripe key and Expo token from Parameter Store itself.
          {
            terraform init -input=false \
              -backend-config="envs/${DEPLOY_ENV}.s3.tfbackend" \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="region=${AWS_REGION}"
            terraform apply -input=false -auto-approve -var-file="envs/${DEPLOY_ENV}.tfvars"
          } 2>&1 | awk -f "$GITHUB_WORKSPACE/.github/scripts/redact-aws-log.awk"
        env:
          TF_IN_AUTOMATION: 'true'
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_ssm_prefix: ${{ vars.SSM_PREFIX || '/gameplan' }}

      - name: Build website
        run: npm run client:build
        env:
          BUILD_CONFIGURATION: production
          EXPO_PUBLIC_API_BASE_URL: ${{ env.API_BASE_URL }}
          EXPO_PUBLIC_WS_BASE_URL: ${{ env.WS_BASE_URL }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ env.GOOGLE_MAPS_BROWSER_API_KEY }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          EXPO_PUBLIC_AUTH_DISABLED: 'false'
          # App-link files for the store apps. Leave unset until the apps ship for this environment.
          # The same team id Sign in with Apple uses, when Parameter Store already has it.
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || env.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}

      - name: Publish website
        run: |
          set -o pipefail
          {
            aws s3 sync client/expo/dist "s3://${SITE_BUCKET_NAME}" --delete
            # iOS reads this file as JSON, and it has no extension to infer that from.
            if [ -f client/expo/dist/.well-known/apple-app-site-association ]; then
              aws s3 cp client/expo/dist/.well-known/apple-app-site-association \
                "s3://${SITE_BUCKET_NAME}/.well-known/apple-app-site-association" \
                --content-type application/json
            fi
            aws cloudfront create-invalidation --distribution-id "${SITE_DISTRIBUTION_ID}" --paths "/*"
          } 2>&1 | awk -f .github/scripts/redact-aws-log.awk

  # A release also ships the store apps, once Terraform has refreshed the EAS
  # variables above. Staging builds are started by hand from "App builds".
  apps:
    needs: deploy
    if: github.event_name == 'release'
    uses: ./.github/workflows/eas-build.yml
    with:
      environment: production
      platform: all
      submit: true
    secrets: inherit
