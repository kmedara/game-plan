name: App builds

# Starts EAS builds of the iOS and Android apps. The builds run on Expo's
# servers; this job only queues them (`--no-wait`) and links them in the summary.
# Each build reads the EAS environment Terraform fills, so run Deploy first.
# The first build of each platform must be run by hand (docs/store-release.md).

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      platform:
        type: string
        default: all
      submit:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: choice
        options:
          - staging
          - production
        default: staging
      platform:
        description: Platform
        type: choice
        options:
          - all
          - android
          - ios
        default: all
      submit:
        description: Submit to TestFlight and the Play internal track (production only)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: eas-build-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      # Build profile in client/expo/eas.json for each environment.
      PROFILE: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
      PLATFORM: ${{ inputs.platform }}
      SUBMIT: ${{ inputs.submit && inputs.environment == 'production' }}
      # Read the changes before raising it.
      EAS_CLI: eas-cli@24.12.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # The same token Terraform uses for the EAS variables.
      - name: Load Expo token
        run: |
          set -o pipefail
          token=$(aws ssm get-parameter --name "${SSM_PREFIX%/}/expo-token" --query Parameter.Value --output text)
          if [ -z "${token}" ] || [ "${token}" = "None" ]; then
            echo "${SSM_PREFIX%/}/expo-token is not set."
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "EXPO_TOKEN=${token}" >> "$GITHUB_ENV"
        env:
          SSM_PREFIX: ${{ vars.SSM_PREFIX || '/gameplan' }}

      # EAS reads app.config.ts, which needs the workspace installed.
      - run: npm ci

      - name: Start builds
        working-directory: client/expo
        run: |
          set -o pipefail
          args=(--profile "${PROFILE}" --platform "${PLATFORM}" --non-interactive --no-wait --json)
          if [ "${SUBMIT}" = "true" ]; then
            args+=(--auto-submit)
          fi
          npx --yes "${EAS_CLI}" build "${args[@]}" > "${RUNNER_TEMP}/builds.json"
          builds_url="https://expo.dev/accounts/$(jq -r .expo.owner app.json)/projects/$(jq -r .expo.slug app.json)/builds"
          {
            echo "### ${PROFILE} builds"
            jq -r --arg url "${builds_url}" '.[] | "- \(.platform): \($url)/\(.id)"' "${RUNNER_TEMP}/builds.json"
            if [ "${SUBMIT}" = "true" ]; then
              echo ""
              echo "Each build is submitted when it finishes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
