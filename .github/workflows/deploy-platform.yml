name: Deploy platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-stack.yml
    with:
      environment: ${{ inputs.environment }}
      stack: platform
    secrets: inherit
